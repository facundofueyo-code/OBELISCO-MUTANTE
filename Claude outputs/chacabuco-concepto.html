<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concepto · Edificio de Av. de Mayo y Chacabuco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Libre+Caslon+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9e1cf;--dim:#9c937f;--brass:#c9a45a;--panel:rgba(16,19,24,.86);--line:rgba(201,164,90,.35)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#07090c;overflow:hidden;color:var(--ink);font:15px/1.4 "Barlow Condensed",system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:250px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);padding:12px 12px 10px;backdrop-filter:blur(6px)}
#ui h1{font:italic 19px/1.15 "Libre Caslon Text",Georgia,serif;margin:0 0 2px;color:var(--ink)}
#ui p.sub{margin:0 0 10px;color:var(--dim);font-size:14px}
#ui .g{margin:8px 0 0}
#ui .g span{display:block;color:var(--brass);font-size:13px;letter-spacing:.04em;margin-bottom:4px}
#ui button{font:600 14px "Barlow Condensed",sans-serif;color:var(--ink);background:transparent;border:1px solid rgba(233,225,207,.22);padding:5px 8px;margin:0 3px 4px 0;cursor:pointer}
#ui button:hover{border-color:var(--brass)}
#ui button.on{background:var(--brass);color:#15120c;border-color:var(--brass)}
#ui button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
#tog{display:none}
#help{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:min(360px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);padding:8px 10px;color:var(--dim);font-size:14px}
#help b{color:var(--ink);font-weight:600}
#el{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
#el[hidden]{display:none}
#el #elTxt{color:var(--brass);font-size:15px;margin-right:4px}
#el button{font:600 15px "Barlow Condensed",sans-serif;color:var(--ink);background:transparent;border:1px solid rgba(233,225,207,.3);min-width:38px;padding:5px 8px;cursor:pointer}
#el button.on{background:var(--brass);color:#15120c;border-color:var(--brass)}
#el button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
#where{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));font:italic 16px "Libre Caslon Text",Georgia,serif;color:var(--ink);text-shadow:0 1px 6px #000;pointer-events:none;opacity:.9}
#joy{position:fixed;inset:0;pointer-events:none}
@media (max-width:640px){
  #ui{width:auto;right:12px;padding:8px 10px}
  #ui.min .body{display:none}
  #tog{display:inline-block;position:absolute;right:8px;top:6px}
  #where{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  #help{font-size:13px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="where"></div>
<div id="ui" class="min">
  <h1>Av. de Mayo y Chacabuco</h1>
  <p class="sub">Concepto para revisar. No está en el juego.</p>
  <button id="tog" aria-label="Mostrar u ocultar el panel">Vistas</button>
  <div class="body">
    <div class="g"><span>Afuera</span>
      <button data-v="ext">Maqueta</button><button data-v="esquina">Desde la Torre Patagonia</button><button data-v="vereda">Vereda</button><button data-v="techo">Techos</button>
    </div>
    <div class="g"><span>Adentro</span>
      <button data-v="zaguan">Zaguán</button><button data-v="patio">Patio</button><button data-v="ascensor">Escalera</button><button data-v="cabina">Ascensor</button>
      <div><button data-v="p1">1°</button><button data-v="p2">2°</button><button data-v="p3">3°</button><button data-v="p4">4°</button><button data-v="p5">5°</button></div>
    </div>
    <div class="g"><span>El 5° A (dúplex hacia la mansarda, se entra)</span>
      <button data-v="dEnt">Entrada</button><button data-v="dEsc">Escalera</button><button data-v="dDor">Dormitorio</button><button data-v="dLiv">Living (arriba)</button><button data-v="dCom">Comedor</button><button data-v="dCoc">Cocina</button>
    </div>
    <div class="g"><span>Ver</span>
      <button id="bCut">Sin fachada</button><button id="bFl">Linterna</button><button id="bBr">Más luz</button>
    </div>
  </div>
</div>
<div id="help"></div>
<div id="el" hidden><span id="elTxt"></span><span id="elBtns"></span></div>
<canvas id="joy"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================================
   EDIFICIO AV. DE MAYO 694 / CHACABUCO 45 — concepto
   Origen local: esquina teórica de las dos líneas municipales (Chacabuco y Av. de Mayo).
   x hacia el este (a lo largo de Av. de Mayo), z hacia el sur (la avenida queda en z > 0),
   y hacia arriba. Igual que el juego: el norte es −z.
   En el juego la esquina de las calles está en (457,1 ; 572,1): ver notas.
   ===================================================================================== */
(()=>{
'use strict';
const PI=Math.PI;
/* ---------- azar con semilla fija (el edificio sale siempre igual) ---------- */
let SEED=20261005;const rnd=()=>{SEED=(SEED*16807)%2147483647;return (SEED-1)/2147483646;};
const rr=(a,b)=>a+(b-a)*rnd(),pick=a=>a[Math.floor(rnd()*a.length)];
/* ---------- vectores ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const vlen=a=>Math.hypot(a[0],a[1],a[2]),nrm=a=>{const l=vlen(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const UP=[0,1,0];

/* =====================================================================================
   MEDIDAS (m)
   ===================================================================================== */
const LX=32,LZ=26,OCH=3.6;                 /* frente sobre Av. de Mayo (incl. ochava), fondo sobre Chacabuco, cateto de la ochava */
const LV=[0.75,5.0,8.6,12.2,15.8,19.4,23.0];/* nivel de piso: PB (sobre 4 escalones), pisos 1° a 5° y la losa del altillo de la mansarda */
const YCOR=23.7,YMT=27.4,YCEIL6=22.7;       /* tope de la cornisa mayor, tope de la mansarda, cielorraso del 5° (arriba queda el altillo) */
const WALLT=.45,REV=.32;                    /* espesor del muro de fachada, profundidad del vano */
/* planta interior: pozo de aire con galerías alrededor, escalera y ascensor jaula, zaguán */
const WX0=12.5,WX1=24.5,WZ0=-19,WZ1=-12.5;  /* pozo de aire (patio en PB) */
const CX0=10.7,CX1=26.3,CZ0=-20.8,CZ1=-10.7;/* borde exterior de las galerías */
const SX0=12,SX1=17,SZ1=-1.6;               /* caja de escalera (de CZ1 a SZ1) */
const LAND=-8.6,MID=-3.4;                   /* fin del descanso de piso / arranque del descanso intermedio */
const FL1=[15.6,17],FL2=[12,13.4];          /* tramo que sube hacia la calle / tramo que vuelve */
const ELV=[13.6,15.4,-8.4,-3.6];            /* jaula del ascensor */
const ZG0=19.85,ZG1=22.05,ZSTEP=-1.8,ZCANCEL=-3.6;/* zaguán: ancho, fin de los escalones, mampara */
const GX0=13.78,GX1=15.22,GH=2.25;          /* puerta de la jaula en cada rellano (reja plegadiza) */
const CB=[13.72,15.28,-8.28,-3.72];         /* cabina: x0,x1,z0,z1 */

/* calles */
const SWA=5.5,AVW=19,SWC=2.8,CHW=8;         /* vereda de Av. de Mayo, calzada, vereda de Chacabuco, calzada */
const zAvS=SWA+AVW,zOppA=zAvS+SWA;          /* cordón sur y línea de edificación de enfrente */
const xChW=-SWC-CHW,xOppC=xChW-SWC;

/* =====================================================================================
   TEXTURAS (canvas)
   ===================================================================================== */
const TEX={};
function ctex(name,w,h,draw,rep=true){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=4;t.generateMipmaps=true;t.minFilter=THREE.LinearMipmapLinearFilter;TEX[name]=t;return t;}
function noise(g,w,h,n,cols,smin,smax,a){for(let i=0;i<n;i++){g.globalAlpha=a*rr(.4,1);g.fillStyle=pick(cols);const s=rr(smin,smax);g.fillRect(rnd()*w,rnd()*h,s,s*rr(.5,1.6));}g.globalAlpha=1;}
function blotch(g,w,h,n,col,rmin,rmax,a){for(let i=0;i<n;i++){const x=rnd()*w,y=rnd()*h,r=rr(rmin,rmax);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col.replace('A',a*rr(.4,1)));gr.addColorStop(1,col.replace('A',0));g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}}
function streaks(g,w,h,n,a){for(let i=0;i<n;i++){const x=rnd()*w,y=rnd()*h*.6,l=rr(h*.2,h*.8);const gr=g.createLinearGradient(0,y,0,y+l);gr.addColorStop(0,`rgba(30,26,20,${a*rr(.3,1)})`);gr.addColorStop(1,'rgba(30,26,20,0)');g.fillStyle=gr;g.fillRect(x,y,rr(2,7),l);}}
/* símil piedra París: sillares tenues, manchas y chorreaduras (2 m por repetición) */
ctex('stucco',512,512,(g,w,h)=>{g.fillStyle='#b9a682';g.fillRect(0,0,w,h);blotch(g,w,h,40,'rgba(120,100,70,A)',20,90,.25);blotch(g,w,h,25,'rgba(225,210,180,A)',20,70,.2);
  noise(g,w,h,9000,['#9a8a6a','#cfbe98','#a7956f'],1,2.4,.35);g.strokeStyle='rgba(70,58,40,.35)';g.lineWidth=1.5;
  for(let y=0;y<h;y+=64){g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke();for(let x=((y/64)%2)*64;x<w;x+=128){g.beginPath();g.moveTo(x+.5,y);g.lineTo(x+.5,y+64);g.stroke();}}
  streaks(g,w,h,26,.28);});
/* almohadillado (bandas de los pisos bajos) */
ctex('rust',512,512,(g,w,h)=>{g.fillStyle='#b4a17c';g.fillRect(0,0,w,h);blotch(g,w,h,30,'rgba(110,92,64,A)',20,80,.25);noise(g,w,h,8000,['#958563','#c9b892'],1,2.4,.35);
  for(let y=0;y<h;y+=51.2){const gr=g.createLinearGradient(0,y,0,y+10);gr.addColorStop(0,'rgba(40,32,22,.75)');gr.addColorStop(1,'rgba(40,32,22,0)');g.fillStyle=gr;g.fillRect(0,y,w,10);g.fillStyle='rgba(240,228,200,.35)';g.fillRect(0,y+48,w,3);}
  streaks(g,w,h,20,.3);});
ctex('granite',256,256,(g,w,h)=>{g.fillStyle='#17181a';g.fillRect(0,0,w,h);noise(g,w,h,5000,['#2b2d31','#0c0c0d','#45474b'],1,2,.7);});
ctex('slate',256,256,(g,w,h)=>{g.fillStyle='#3c434b';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=21)for(let x=(y/21%2)*16;x<w+32;x+=32){g.fillStyle=`rgb(${50+rnd()*22|0},${56+rnd()*22|0},${64+rnd()*22|0})`;g.beginPath();g.moveTo(x-16,y);g.lineTo(x+16,y);g.lineTo(x+16,y+14);g.quadraticCurveTo(x,y+26,x-16,y+14);g.fill();g.strokeStyle='rgba(15,18,22,.6)';g.stroke();}
  blotch(g,w,h,10,'rgba(120,130,110,A)',10,40,.2);});
ctex('zinc',256,256,(g,w,h)=>{g.fillStyle='#6d7273';g.fillRect(0,0,w,h);for(let x=0;x<w;x+=32){g.fillStyle='rgba(20,20,20,.45)';g.fillRect(x,0,3,h);g.fillStyle='rgba(220,220,220,.25)';g.fillRect(x+3,0,2,h);}blotch(g,w,h,14,'rgba(60,50,40,A)',10,50,.35);});
ctex('iron',64,64,(g,w,h)=>{g.fillStyle='#1d1e1f';g.fillRect(0,0,w,h);noise(g,w,h,300,['#2e2a26','#3a2b20'],1,3,.6);});
ctex('wood',256,256,(g,w,h)=>{g.fillStyle='#3a2416';g.fillRect(0,0,w,h);for(let i=0;i<60;i++){g.strokeStyle=`rgba(${20+rnd()*40|0},${12+rnd()*20|0},6,.5)`;g.beginPath();const x=rnd()*w;g.moveTo(x,0);g.bezierCurveTo(x+rr(-8,8),h*.3,x+rr(-8,8),h*.6,x+rr(-6,6),h);g.stroke();}});
/* persiana de librillo, dos hojas */
ctex('shutter',128,256,(g,w,h)=>{g.fillStyle='#bdb8ac';g.fillRect(0,0,w,h);for(const x0 of [0,w/2]){g.fillStyle='#8f8a80';g.fillRect(x0+3,3,w/2-6,h-6);for(let y=10;y<h-8;y+=7){g.fillStyle='#d8d3c6';g.fillRect(x0+8,y,w/2-16,4);g.fillStyle='#6d685f';g.fillRect(x0+8,y+4,w/2-16,2);}}
  g.fillStyle='#4f4b44';g.fillRect(w/2-1,0,2,h);blotch(g,w,h,8,'rgba(40,36,30,A)',8,30,.35);noise(g,w,h,600,['#5d584f','#e5e0d4'],1,2,.4);},false);
/* vidrio oscuro con travesaños; un brillo de la calle */
ctex('glass',128,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#1c2430');gr.addColorStop(.55,'#0c1016');gr.addColorStop(1,'#151b24');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(160,180,210,.10)';g.beginPath();g.moveTo(w*.15,0);g.lineTo(w*.45,0);g.lineTo(w*.1,h);g.lineTo(0,h);g.fill();
  g.fillStyle='#2a2119';g.fillRect(0,0,w,6);g.fillRect(0,h-6,w,6);g.fillRect(0,0,6,h);g.fillRect(w-6,0,6,h);g.fillRect(w/2-3,0,6,h);g.fillRect(0,h*.62,w,5);},false);
ctex('glassLit',128,256,(g,w,h)=>{const gr=g.createRadialGradient(w*.5,h*.45,4,w*.5,h*.5,h*.6);gr.addColorStop(0,'#f2c27a');gr.addColorStop(1,'#6b3a17');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(60,25,10,.55)';g.beginPath();g.moveTo(6,6);g.quadraticCurveTo(w*.35,h*.5,w*.22,h-6);g.lineTo(6,h-6);g.fill();g.beginPath();g.moveTo(w-6,6);g.quadraticCurveTo(w*.7,h*.5,w*.8,h-6);g.lineTo(w-6,h-6);g.fill();
  g.fillStyle='#2a2119';g.fillRect(0,0,w,6);g.fillRect(0,h-6,w,6);g.fillRect(0,0,6,h);g.fillRect(w-6,0,6,h);g.fillRect(w/2-3,0,6,h);g.fillRect(0,h*.62,w,5);},false);
/* vidrio roto: los huecos son transparentes y dejan ver el negro de atrás */
ctex('glassBroken',128,256,(g,w,h)=>{g.drawImage(TEX.glass.image,0,0);g.globalCompositeOperation='destination-out';for(let k=0;k<3;k++){const cx=rr(20,w-20),cy=rr(30,h-30);g.beginPath();for(let i=0;i<9;i++){const a=i/9*PI*2,r=rr(10,34);i?g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):g.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}g.fill();}
  g.globalCompositeOperation='source-over';g.strokeStyle='rgba(200,215,230,.35)';for(let i=0;i<14;i++){g.beginPath();const x=rr(10,w-10),y=rr(10,h-10);g.moveTo(x,y);g.lineTo(x+rr(-40,40),y+rr(-60,60));g.stroke();}},false);
ctex('boards',128,256,(g,w,h)=>{g.fillStyle='#0b0b0c';g.fillRect(0,0,w,h);for(let i=0;i<6;i++){const y=rr(0,h-30),a=rr(-.5,.5);g.save();g.translate(w/2,y+14);g.rotate(a);g.fillStyle=`rgb(${110+rnd()*40|0},${85+rnd()*30|0},${55+rnd()*20|0})`;g.fillRect(-w,-12,2*w,24);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(-w,8,2*w,4);g.restore();}},false);
function metalShutter(name,tag){ctex(name,256,256,(g,w,h)=>{g.fillStyle='#7d8080';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=8){g.fillStyle='rgba(30,30,30,.55)';g.fillRect(0,y,w,2);g.fillStyle='rgba(230,230,230,.18)';g.fillRect(0,y+2,w,1);}
  blotch(g,w,h,14,'rgba(90,60,35,A)',10,50,.4);g.save();g.translate(w/2,h*.55);g.rotate(rr(-.12,.12));g.font=`900 ${tag.length>12?26:40}px Impact,Arial Black,sans-serif`;g.textAlign='center';g.lineWidth=6;g.strokeStyle='rgba(20,20,20,.8)';g.fillStyle=pick(['#c23b2a','#e8e2d0','#2d6a9a','#d8b22a']);g.strokeText(tag,0,0);g.fillText(tag,0,0);g.restore();
  g.fillStyle='rgba(20,20,20,.8)';g.fillRect(w*.42,h-14,w*.16,10);},false);}
metalShutter('shut1','SIN LUZ DESDE EL MARTES');metalShutter('shut2','AYUDA');metalShutter('shut3','LOS DE NEGRO NO');metalShutter('shut4','');
/* letreros (texto genérico, sin marcas) */
function sign(name,w,h,bg,fg,text,font,extra){ctex(name,w,h,(g)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle=fg;g.font=font;g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+2);if(extra)extra(g,w,h);blotch(g,w,h,8,'rgba(0,0,0,A)',10,60,.35);},false);}
sign('sCafe',512,128,'#0d0d0d','#e8732c','CAFÉ','700 92px Georgia,serif');
sign('sConf',512,128,'#0d0d0d','#e8732c','CONFITERÍA','700 70px Georgia,serif');
sign('sPap',512,128,'#1a1a1a','#d9d4c6','PAPELERA','600 80px Arial Narrow,Arial,sans-serif');
sign('sParr',512,128,'#3a120d','#e9d7b0','PARRILLA AL CARBÓN','italic 700 56px Georgia,serif');
sign('sLib',512,128,'#132230','#d9d4c6','LIBROS','600 84px Arial Narrow,Arial,sans-serif');
ctex('clock',256,256,(g,w,h)=>{g.fillStyle='#0d0d0d';g.fillRect(0,0,w,h);g.fillStyle='#e9e3d2';g.beginPath();g.arc(128,128,112,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=6;g.stroke();
  for(let i=0;i<12;i++){const a=i/12*PI*2;g.fillStyle='#111';g.fillRect(128+Math.sin(a)*92-3,128-Math.cos(a)*92-8,6,16);}
  const hand=(a,l,wd)=>{g.save();g.translate(128,128);g.rotate(a);g.fillStyle='#111';g.fillRect(-wd/2,-l,wd,l+10);g.restore();};hand((3+17/60)/12*PI*2,56,8);hand(17/60*PI*2,86,5);
  g.strokeStyle='rgba(30,30,30,.6)';g.lineWidth=2;g.beginPath();g.moveTo(60,70);g.lineTo(160,190);g.stroke();},false);
/* pisos */
ctex('marble',256,256,(g,w,h)=>{for(let y=0;y<2;y++)for(let x=0;x<2;x++){const b=(x+y)%2;g.fillStyle=b?'#1c1c1e':'#d8d4ca';g.fillRect(x*128,y*128,128,128);noise(g,256,256,0,[],1,1,0);
  for(let i=0;i<5;i++){g.strokeStyle=b?'rgba(120,120,125,.25)':'rgba(120,115,105,.3)';g.beginPath();g.moveTo(x*128+rnd()*128,y*128);g.bezierCurveTo(x*128+rnd()*128,y*128+40,x*128+rnd()*128,y*128+90,x*128+rnd()*128,y*128+128);g.stroke();}}

  if(EMTINT[b.key]){/* color de las luces: se aplica sobre la textura blanca */m.fragmentShader=FS.replace('texture2D(emap,vUv).rgb','texture2D(emap,vUv).rgb*vec3('+et.map(v=>v.toFixed(3)).join(',')+')');}
  if(b.key==='beam'){m.fragmentShader=`precision highp float;uniform sampler2D map;varying vec2 vUv;varying vec3 vC,vWP,vN;varying float vD;void main(){vec4 t=texture2D(map,vUv);gl_FragColor=vec4(t.rgb*t.a*.8,1.);}`;}
  const mesh=new THREE.Mesh(g,m);mesh.renderOrder=sp.tr?2:0;if(!GROUPS[b.grp]){GROUPS[b.grp]=new THREE.Group();scene.add(GROUPS[b.grp]);}GROUPS[b.grp].add(mesh);}
/* rejas plegadizas: el pivote es el lado donde se pliegan (x = GX1) */
for(const k of [0,1,2,3,4,5,'Gate']){const g=GROUPS[k==='Gate'?'cabGate':'gate'+k];if(!g)continue;const px=k==='Gate'?CB[1]:GX1;g.children.forEach(m=>m.geometry.translate(-px,0,0));g.position.x=px;}
GROUPS.cab.add(GROUPS.cabGate);
const BUILD_MS=performance.now()-t0;

/* =====================================================================================
   CÁMARA, CONTROLES
   ===================================================================================== */
const cv=document.getElementById('c');const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const cam=new THREE.PerspectiveCamera(62,1,.05,900);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();jc.width=w*devicePixelRatio;jc.height=h*devicePixelRatio;}
const jc=document.getElementById('joy');addEventListener('resize',resize);
let MODE='orbit';const ORB={t:new THREE.Vector3(12,12,-10),r:62,th:-2.35,ph:.32};
const PL={x:0,z:0,y:0,yaw:0,pitch:0};const EYE=1.62,RAD=.28;
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyF')toggleFl();
  if(e.code==='KeyE'){const k=landingNear();if(k>=0)elCall(k);}
  const m=e.code.match(/^(?:Digit|Numpad)([0-5])$/);if(m&&inCab())elCall(+m[1]);});addEventListener('keyup',e=>keys[e.code]=0);
function groundAt(x,z,y){let best=null,bd=1e9;for(const r of WALK){if(r.on&&!r.on())continue;const m=r.m??RAD;if(x<r.x0+m||x>r.x1-m||z<r.z0+m||z>r.z1-m)continue;const ry=r.y(x,z);const d=ry-y;if(d>.6||d<-1.3)continue;if(Math.abs(d)<bd){bd=Math.abs(d);best=ry;}}return best;}
function pushWalls(x,z,y){for(const w of AWALL){if(w.y1<y+.25||w.y0>y+1.7)continue;const dx=w.bx-w.ax,dz=w.bz-w.az,l2=dx*dx+dz*dz;let t=((x-w.ax)*dx+(z-w.az)*dz)/l2;t=Math.max(0,Math.min(1,t));
  let ex=x-(w.ax+dx*t),ez=z-(w.az+dz*t);const d=Math.hypot(ex,ez);if(d<RAD){if(d<1e-6){ex=-dz;ez=dx;}const k=(RAD-d)/Math.hypot(ex,ez);x+=ex*k;z+=ez*k;}}return [x,z];}
function walkStep(dt,mx,mz,run){const sp=(run?6.2:2.9)*dt;const c=Math.cos(PL.yaw),s=Math.sin(PL.yaw);const dx=(mx*c+mz*s)*sp,dz=(-mx*s+mz*c)*sp;
  const tryP=(x,z)=>{[x,z]=pushWalls(x,z,PL.y);[x,z]=pushWalls(x,z,PL.y);const g=groundAt(x,z,PL.y);if(g===null)return false;PL.x=x;PL.z=z;PL.y+=(g-PL.y)*Math.min(1,dt*14);return true;};
  if(!(dx||dz)){const g=groundAt(PL.x,PL.z,PL.y);if(g!==null)PL.y+=(g-PL.y)*Math.min(1,dt*14);return;}
  if(!tryP(PL.x+dx,PL.z+dz)){if(!tryP(PL.x+dx,PL.z))tryP(PL.x,PL.z+dz);}}
/* arrastrar: órbita o mirar; ruedita y pellizco: zoom; en el celular, mitad izquierda = caminar */
let drag=null,pinch=null,stick=null;const ptr=new Map();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(MODE==='walk'&&e.pointerType==='touch'&&e.clientX<innerWidth*.45&&!stick){stick={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY};return;}
  if(ptr.size===2&&MODE==='orbit'){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),r:ORB.r};drag=null;return;}
  drag={id:e.pointerId,x:e.clientX,y:e.clientY};
  if(MODE==='walk'&&e.pointerType==='mouse'&&!document.pointerLockElement)cv.requestPointerLock?.();});
cv.addEventListener('pointermove',e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(stick&&e.pointerId===stick.id){stick.x=e.clientX;stick.y=e.clientY;return;}
  if(pinch&&ptr.size===2){const [a,b]=[...ptr.values()];ORB.r=Math.max(8,Math.min(260,pinch.r*pinch.d/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y))));return;}
  if(document.pointerLockElement)return;if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;look(dx,dy);});
const up=e=>{ptr.delete(e.pointerId);if(stick&&e.pointerId===stick.id)stick=null;if(drag&&drag.id===e.pointerId)drag=null;if(ptr.size<2)pinch=null;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('mousemove',e=>{if(document.pointerLockElement===cv)look(e.movementX,e.movementY);});
function look(dx,dy){if(MODE==='orbit'){ORB.th-=dx*.006;ORB.ph=Math.max(-.05,Math.min(1.45,ORB.ph+dy*.005));}else{PL.yaw-=dx*.0035;PL.pitch=Math.max(-1.45,Math.min(1.45,PL.pitch-dy*.0035));}}
cv.addEventListener('wheel',e=>{e.preventDefault();if(MODE==='orbit')ORB.r=Math.max(8,Math.min(260,ORB.r*Math.exp(e.deltaY*.0012)));},{passive:false});

/* vistas */
const VIEWS={
  ext:{m:'orbit',t:[12,12,-9],r:80,th:-.35,ph:.55,txt:'Maqueta: arrastrá para girar'},
  techo:{m:'orbit',t:[14,24,-12],r:42,th:-.9,ph:.75,txt:'Mansarda, pabellón de la esquina y claraboya'},
  esquina:{m:'walk',p:[-12.2,28.4],yaw:-.6,pitch:.3,txt:'Desde la vereda de la Torre Patagonia'},
  vereda:{m:'walk',p:[27,3.4],yaw:1.2,pitch:.12,txt:'Vereda de Av. de Mayo'},
  zaguan:{m:'walk',p:[20.95,3.2],yaw:0,pitch:-.02,txt:'Entrada por Av. de Mayo'},
  patio:{m:'walk',p:[18.5,-16.8],yaw:-.6,pitch:1.05,txt:'Patio: mirá para arriba'},
  cabina:{m:'walk',p:[14.5,-4.6],yaw:0,pitch:-.05,lvl:0,txt:'Adentro del ascensor'},
  ascensor:{m:'walk',p:[16.3,-11.6],yaw:2.95,pitch:.3,txt:'Escalera y ascensor jaula'},
};
for(let k=1;k<=5;k++)VIEWS['p'+k]={m:'walk',p:[11.5,-20.1],yaw:-1.5708,pitch:-.04,lvl:k,txt:`${k}° piso`};
Object.assign(VIEWS,{
  dEnt:{m:'walk',p:[13.6,-9.65],yaw:1.5708,pitch:-.05,lvl:5,txt:'5° A: la puerta abierta'},
  dEsc:{m:'walk',p:[11.5,-10.0],yaw:1.5708,pitch:.22,lvl:5,txt:'5° A: la escalera que sube'},
  dDor:{m:'walk',p:[8.6,-1.3],yaw:.95,pitch:-.15,lvl:5,txt:'5° A: dormitorio'},
  dLiv:{m:'walk',p:[9.6,-1.5],yaw:.62,pitch:-.1,y:23.0,txt:'5° A, arriba: living en la mansarda'},
  dCom:{m:'walk',p:[2.3,-10.0],yaw:-2.45,pitch:-.25,y:23.9,txt:'5° A, arriba: comedor, medio piso más'},
  dCoc:{m:'walk',p:[5.0,-7.4],yaw:.64,pitch:-.1,y:23.9,txt:'5° A, arriba: cocina'}});
VIEWS.p4.p=[25.5,-11.4];VIEWS.p4.yaw=0;VIEWS.p4.pitch=-.02;
let curView='ext';
function setView(v){const V=VIEWS[v];if(!V)return;if(v==='cabina'){V.y=EL.y;}curView=v;MODE=V.m;document.querySelectorAll('#ui [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(MODE==='orbit'){ORB.t.set(...V.t);ORB.r=V.r;ORB.th=V.th;ORB.ph=V.ph;}
  else{PL.x=V.p[0];PL.z=V.p[1];PL.yaw=V.yaw;PL.pitch=V.pitch;const y0=V.y!==undefined?V.y:V.lvl!==undefined?LV[V.lvl]:groundAt(PL.x,PL.z,v==='zaguan'||v==='vereda'||v==='esquina'?0:LV[0])??0;PL.y=y0;const g=groundAt(PL.x,PL.z,PL.y);if(g!==null)PL.y=g;}
  const inside=['zaguan','patio','ascensor','cabina','p1','p2','p3','p4','p5','dEnt','dEsc','dLiv','dCom','dCoc','dDor'].includes(v);U.uFogD.value=inside?.05:.012;U.uFogC.value.set(inside?0x050608:0x0a0d12);scene.background.set(inside?0x050608:0x0a0d12);
  if(!flUser){U.uFl.value=inside?1:0;document.getElementById('bFl').classList.toggle('on',inside);}
  document.getElementById('where').textContent=V.txt;help();}
let flUser=false;function toggleFl(){U.uFl.value=U.uFl.value?0:1;flUser=true;document.getElementById('bFl').classList.toggle('on',!!U.uFl.value);}
document.querySelectorAll('#ui [data-v]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
document.getElementById('bFl').addEventListener('click',toggleFl);
document.getElementById('bCut').addEventListener('click',e=>{GROUPS.shell.visible=!GROUPS.shell.visible;e.currentTarget.classList.toggle('on',!GROUPS.shell.visible);});
document.getElementById('bBr').addEventListener('click',e=>{U.uExp.value=U.uExp.value>1?1:2.2;e.currentTarget.classList.toggle('on',U.uExp.value>1);});
document.getElementById('tog').addEventListener('click',()=>document.getElementById('ui').classList.toggle('min'));
if(innerWidth>640)document.getElementById('ui').classList.remove('min');
const touch=matchMedia('(pointer:coarse)').matches;
function help(){document.getElementById('help').innerHTML=MODE==='orbit'?(touch?'<b>Arrastrá</b> para girar, <b>pellizcá</b> para acercar.':'<b>Arrastrá</b> para girar, <b>ruedita</b> para acercar.'):
  (touch?'<b>Mitad izquierda</b>: caminar. <b>Mitad derecha</b>: mirar.':'<b>Clic</b> y mouse para mirar, <b>WASD</b> para caminar, <b>Shift</b> corre, <b>F</b> linterna.')+' Se sube por la escalera o en ascensor'+(touch?' (botones abajo).':' (E llama, 0 a 5 elige el piso).');}
/* parpadeo: tubo y lamparitas con cortes; balizas a medio segundo */
function flick(t){const a=Math.sin(t*1.7)+Math.sin(t*2.9+1.3)+Math.sin(t*.53);let f=.9+.1*Math.sin(t*61);if(a>1.6)f*=Math.sin(t*37)>0?.08:.6;if((t%7.3)<.12)f*=.05;return f;}
/* ---------- ascensor: lógica ---------- */
const LNAME=k=>k?k+'°':'PB';
const inCab=()=>MODE==='walk'&&PL.x>CB[0]&&PL.x<CB[1]&&PL.z>CB[2]&&PL.z<CB[3]&&Math.abs(PL.y-EL.y)<.8;
function landingNear(){if(MODE!=='walk'||inCab())return -1;if(PL.x<GX0-.8||PL.x>GX1+.8||PL.z<-10.2||PL.z>-8.0)return -1;for(let k=0;k<=5;k++)if(Math.abs(PL.y-LV[k])<.4)return k;return -1;}
const blocked=()=>MODE==='walk'&&PL.x>GX0-.2&&PL.x<GX1+.2&&PL.z>-8.75&&PL.z<-7.85&&Math.abs(PL.y-LV[EL.lvl])<.5;
function elCall(k){if(EL.phase!=='moving'&&EL.lvl===k){if(EL.phase==='closing')EL.phase='opening';EL.t=0;return;}if(!EL.q.includes(k))EL.q.push(k);elUI(true);}
let AC2=null;function chime(){try{AC2=AC2||new (window.AudioContext||window.webkitAudioContext)();const t=AC2.currentTime;for(const [f,d] of [[880,0],[660,.18]]){const o=AC2.createOscillator(),g=AC2.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.12,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.6);o.connect(g).connect(AC2.destination);o.start(t+d);o.stop(t+d+.65);}}catch(e){}}
function elUpdate(dt){const A=1.2,VMAX=1.8,DT=1.1;
  switch(EL.phase){
    case'open':EL.t+=dt;if(EL.q[0]===EL.lvl)EL.q.shift();if(EL.q.length&&EL.t>.8&&!blocked())EL.phase='closing';break;
    case'closing':if(blocked()){EL.phase='opening';break;}EL.door-=dt/DT;if(EL.door<=0){EL.door=0;EL.target=EL.q.shift();if(EL.target===undefined||EL.target===EL.lvl){EL.phase='opening';}else{EL.phase='moving';EL.v=0;}}break;
    case'moving':{const goal=LV[EL.target],d=goal-EL.y,dir=Math.sign(d),stop=EL.v*EL.v/(2*A);EL.v=Math.abs(d)<=stop+.002?Math.max(.12,EL.v-A*dt):Math.min(VMAX,EL.v+A*dt);
      const step=EL.v*dt;if(step>=Math.abs(d)){EL.y=goal;EL.v=0;EL.lvl=EL.target;EL.phase='opening';chime();}else EL.y+=dir*step;
      let best=0;for(let k=0;k<=5;k++)if(Math.abs(LV[k]-EL.y)<Math.abs(LV[best]-EL.y))best=k;if(EL.phase==='moving')EL.shown=best;break;}
    case'opening':EL.door+=dt/DT;if(EL.door>=1){EL.door=1;EL.phase='open';EL.t=0;}break;}
  GROUPS.cab.position.y=EL.y;GROUPS.cabGate.scale.x=1-.9*EL.door;
  for(let k=0;k<=5;k++){const g=GROUPS['gate'+k];if(g)g.scale.x=1-.9*((EL.phase!=='moving'&&EL.lvl===k)?EL.door:0);}
  if(inCab())PL.y=EL.y;elUI();}
const elDiv=document.getElementById('el'),elTxt=document.getElementById('elTxt'),elBtns=document.getElementById('elBtns');let elMode='';
function elUI(force){const ic=inCab(),ln=landingNear();const mode=ic?'cab':ln>=0?'land'+ln:'';
  const where=EL.phase==='moving'?`${LNAME(EL.shown??EL.lvl)} ${LV[EL.target]>EL.y?'▲':'▼'}`:LNAME(EL.lvl);
  elDiv.hidden=!mode;if(!mode){elMode='';return;}
  elTxt.textContent=ic?`Ascensor · ${where}`:`Ascensor en ${where}`;
  if(mode!==elMode||force){elMode=mode;elBtns.innerHTML='';
    if(ic){for(let k=0;k<=5;k++){const b=document.createElement('button');b.textContent=LNAME(k);b.setAttribute('aria-label','Ir a '+(k?k+'° piso':'planta baja'));b.onclick=()=>elCall(k);elBtns.appendChild(b);}}
    else{const b=document.createElement('button');b.textContent='Llamar';b.onclick=()=>elCall(ln);elBtns.appendChild(b);}}
  if(ic)[...elBtns.children].forEach((b,k)=>b.classList.toggle('on',EL.q.includes(k)||(EL.phase==='moving'&&EL.target===k)));
  else if(elBtns.firstChild)elBtns.firstChild.classList.toggle('on',EL.q.includes(ln));}
const clock=new THREE.Clock();let T=0;
function frame(){const dt=Math.min(.05,clock.getDelta());T+=dt;U.uF.value=flick(T);U.uF2.value=(T%1.1)<.55?1:.04;elUpdate(dt);
  if(MODE==='orbit'){const cp=Math.cos(ORB.ph);cam.position.set(ORB.t.x+ORB.r*cp*Math.sin(ORB.th),ORB.t.y+ORB.r*Math.sin(ORB.ph),ORB.t.z+ORB.r*cp*Math.cos(ORB.th));cam.lookAt(ORB.t);}
  else{let mx=0,mz=0;if(keys.KeyW||keys.ArrowUp)mz-=1;if(keys.KeyS||keys.ArrowDown)mz+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
    if(stick){const dx=(stick.x-stick.x0)/50,dy=(stick.y-stick.y0)/50;mx=Math.max(-1,Math.min(1,dx));mz=Math.max(-1,Math.min(1,dy));}
    const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;}walkStep(dt,mx,mz,keys.ShiftLeft||keys.ShiftRight||(stick&&l>1.6));
    cam.position.set(PL.x,PL.y+EYE,PL.z);const cp=Math.cos(PL.pitch);cam.lookAt(PL.x-Math.sin(PL.yaw)*cp,PL.y+EYE+Math.sin(PL.pitch),PL.z-Math.cos(PL.yaw)*cp);}
  U.uCam.value.copy(cam.position);cam.getWorldDirection(U.uDir.value);
  R.render(scene,cam);drawStick();requestAnimationFrame(frame);}
function drawStick(){const g=jc.getContext('2d');g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);g.clearRect(0,0,innerWidth,innerHeight);if(!stick)return;g.strokeStyle='rgba(201,164,90,.6)';g.lineWidth=2;g.beginPath();g.arc(stick.x0,stick.y0,46,0,7);g.stroke();
  g.fillStyle='rgba(201,164,90,.5)';const dx=stick.x-stick.x0,dy=stick.y-stick.y0,l=Math.min(46,Math.hypot(dx,dy))/(Math.hypot(dx,dy)||1);g.beginPath();g.arc(stick.x0+dx*l,stick.y0+dy*l,18,0,7);g.fill();}
resize();setView('ext');frame();
window.__view=setView;window.__info=()=>({tris:TRIS,batches:Object.keys(BATCH).length,buildMs:Math.round(BUILD_MS),walk:WALK.length,lights:LIGHTS.length});
window.__walk=(mx,mz,secs)=>{for(let i=0;i<secs*60;i++)walkStep(1/60,mx,mz,false);return {x:+PL.x.toFixed(2),y:+PL.y.toFixed(2),z:+PL.z.toFixed(2)};};
window.__goto=(x,z,secs=30)=>{for(let i=0;i<secs*60;i++){const dx=x-PL.x,dz=z-PL.z;if(Math.hypot(dx,dz)<.25)break;PL.yaw=Math.atan2(-dx,-dz);walkStep(1/60,0,-1,false);}return {x:+PL.x.toFixed(2),y:+PL.y.toFixed(2),z:+PL.z.toFixed(2)};};
window.__el=()=>({y:+EL.y.toFixed(2),lvl:EL.lvl,phase:EL.phase,door:+EL.door.toFixed(2),q:EL.q.slice()});window.__call=elCall;window.__tick=(s)=>{for(let i=0;i<s*60;i++)elUpdate(1/60);return window.__el();};
window.__set=(x,z,y,yaw,pitch)=>{MODE='walk';PL.x=x;PL.z=z;PL.y=y;PL.yaw=yaw;PL.pitch=pitch||0;};
})();
