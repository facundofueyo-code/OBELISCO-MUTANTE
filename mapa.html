<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obelisco Mutante · Mapa</title>
<!--
  MAPA DEL JUEGO · Obelisco Mutante
  ═════════════════════════════════════════════════════════════════════════════════════════════
  Qué es: una página aparte del juego (no lo modifica) que dibuja el mapa a partir de los datos
  reales de obelisco-mutante.html: calles, manzanas, edificios, plazas, Metrobús, subte, secciones,
  zona jugable y puntos de la partida. Metros del juego: x = este, z = sur, origen en el Obelisco.

  De dónde salen los datos
   1. Abierta desde un servidor (GitHub Pages) lee sola obelisco-mutante.html, que tiene que estar
      en la misma carpeta: siempre muestra la versión publicada.
   2. Abierta con doble clic (file://) el navegador no deja leer otros archivos: muestra la copia
      guardada acá adentro (bloque "copia", más abajo) y ofrece el botón «Actualizar»
      (o arrastrar el archivo del juego sobre la página).

  CÓMO ACTUALIZAR LA COPIA GUARDADA
  Para los chats de Claude, cuando un cambio toca el mapa: calles, manzanas, secciones, límites,
  edificios emblemáticos o puntos de la partida. Guardar estas líneas como actualizar-mapa.js al
  lado de mapa.html y obelisco-mutante.html, correr «node actualizar-mapa.js» y borrar el script:

    const fs=require('fs');
    let h=fs.readFileSync('mapa.html','utf8');
    const corte=id=>{const a=h.indexOf('>',h.indexOf('<scr'+'ipt id="'+id+'"'))+1;return [a,h.indexOf('</scr'+'ipt>',a)];};
    const [la,lb]=corte('lector');
    const LECTOR=new Function(h.slice(la,lb)+';return LECTOR;')();
    const d=LECTOR.leerJuego(fs.readFileSync('obelisco-mutante.html','utf8'));
    d.fecha=new Date().toISOString().slice(0,10);
    if(d.avisos.length)console.log('AVISOS:',d.avisos);
    const [ca,cb]=corte('copia');
    h=h.slice(0,ca)+JSON.stringify(d).replace(/</g,'\\u003c')+h.slice(cb);
    fs.writeFileSync('mapa.html',h);
    console.log('copia actualizada a v'+d.version);

  Si salen AVISOS, el juego cambió la forma de escribir algo que el mapa lee (límites de la zona
  jugable, vallas, jefes…): ajustar la función leerJuego del bloque "lector".
  Si el juego suma un edificio modelado a mano o una sección nueva, sumar su nombre en las tablas
  HITOS y NOMBRE_SEC del bloque "modelo". Las secciones nuevas que sigan el formato de SEC
  (osm + det + out) y de SECDEF (rect) aparecen solas.

  Datos de base: OpenStreetMap (© colaboradores de OSM, ODbL) y Buenos Aires Data (tejido urbano, GCBA).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Creepster&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#0b0d16; --sodium:#ffa23a; --bile:#a6e22e; --blood:#c0182f; --bone:#efe6d2;
  --line:rgba(239,230,210,.14); --line2:rgba(239,230,210,.28); --dim:rgba(239,230,210,.62);
  --panel:#11131d; --panel2:#181b28;
  --hud:'Chakra Petch','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --display:'Creepster',Impact,'Arial Black',fantasy;
  --barra:50px; --pie:30px; --ancho:318px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--bone);font-family:var(--hud);font-size:14px;overflow:hidden;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sodium);outline-offset:1px}

/* ---------- barra de arriba ---------- */
#barra{position:fixed;inset:0 0 auto 0;height:var(--barra);display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:6;white-space:nowrap}
.marca{display:flex;align-items:baseline;gap:8px;flex:none}
.marca b{font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:.04em;color:var(--bile);text-shadow:0 0 14px rgba(166,226,46,.25)}
.marca span{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--sodium);text-transform:uppercase}
#estado{display:flex;align-items:center;gap:7px;flex:none;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 10px;border:1px solid var(--line);background:rgba(0,0,0,.3);border-radius:2px}
#estado i{width:8px;height:8px;border-radius:50%;background:var(--sodium);flex:none}
#estado.vivo i{background:var(--bile);box-shadow:0 0 8px var(--bile)}
#estado.aviso{border-color:rgba(255,162,58,.5)}
.grupo{display:flex;align-items:center;gap:4px;flex:none}
#vistas{overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
#vistas::-webkit-scrollbar{display:none}
.sep{width:1px;height:22px;background:var(--line);flex:none;margin:0 2px}
.bt{flex:none;height:32px;padding:0 11px;border:1px solid var(--line);background:rgba(239,230,210,.04);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;transition:background .12s,border-color .12s}
.bt:hover{background:rgba(239,230,210,.1);border-color:var(--line2)}
.bt.on{background:rgba(255,162,58,.16);border-color:var(--sodium);color:var(--sodium)}
.bt.pri{border-color:rgba(166,226,46,.5);color:var(--bile)}
.bt.pri:hover{background:rgba(166,226,46,.12)}
.empuje{flex:1 1 0;min-width:0}
#btnPanel{display:none}

/* ---------- mapa ---------- */
#zona{position:fixed;inset:var(--barra) var(--ancho) var(--pie) 0;background:#07080d}
body.sinpanel #zona{right:0}
#lienzo{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#lienzo.arrastra{cursor:grabbing}
#lienzo.cruz{cursor:crosshair}
#norte{position:absolute;right:12px;top:12px;width:34px;height:44px;pointer-events:none;opacity:.9}
#zoom{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:4px}
#zoom .bt{width:34px;height:34px;padding:0;font-size:18px;background:rgba(17,19,29,.9)}
#ayuda{position:absolute;left:12px;bottom:14px;max-width:min(430px,calc(100% - 70px));padding:9px 12px;background:rgba(17,19,29,.92);border:1px solid var(--line2);border-left:3px solid var(--sodium);font-size:12.5px;line-height:1.45;border-radius:2px}
#ayuda b{color:var(--sodium);font-weight:600}
#ayuda .x{float:right;margin:-4px -6px 0 8px;border:0;background:none;font-size:16px;opacity:.7;padding:2px 6px}

/* ---------- marcador ---------- */
#pin{position:absolute;z-index:3;min-width:230px;max-width:330px;padding:10px 12px 11px;background:rgba(17,19,29,.97);border:1px solid var(--line2);border-top:2px solid var(--sodium);box-shadow:0 10px 30px rgba(0,0,0,.55);font-size:12.5px;line-height:1.45;border-radius:2px}
#pin .coord{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#pin .coord b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#pin .coord .bt{height:26px;padding:0 8px;font-size:11px;margin-left:auto}
#pin .x{border:0;background:none;font-size:17px;opacity:.7;padding:0 4px;margin-right:-4px}
#pin p{margin:3px 0 0}
#pin p span{color:var(--dim)}
#pin p.t{color:var(--sodium);font-weight:600}
#pin p.geo{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
#pin a{color:var(--bile);text-underline-offset:2px}

/* ---------- panel ---------- */
#panel{position:fixed;top:var(--barra);right:0;bottom:var(--pie);width:var(--ancho);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
body.sinpanel #panel{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;height:38px;border:0;border-bottom:2px solid transparent;background:none;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tabs button:hover{color:var(--bone)}
.tabs button.on{color:var(--sodium);border-bottom-color:var(--sodium)}
.hoja{flex:1;overflow:auto;padding:12px 14px 18px;scrollbar-width:thin;scrollbar-color:rgba(239,230,210,.25) transparent}
.hoja h3{margin:16px 0 7px;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--sodium)}
.hoja h3:first-child{margin-top:2px}
.hoja p{margin:0 0 8px;font-size:12.5px;line-height:1.5;color:var(--dim)}
.capa{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;cursor:pointer;user-select:none}
.capa input{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1px solid var(--line2);background:rgba(0,0,0,.35);margin:0;flex:none;display:grid;place-items:center;cursor:pointer}
.capa input:checked{background:var(--sodium);border-color:var(--sodium)}
.capa input:checked::after{content:'';width:7px;height:4px;border:2px solid #14110a;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.capa.sub{padding-left:24px;font-size:12.5px;color:var(--dim)}
.mu{width:24px;height:15px;flex:none;display:grid;place-items:center;border:1px solid rgba(239,230,210,.24)}
.mu i{display:block;font-style:normal}
.mu i.l{width:16px;border-top:2px solid}
.mu i.d{width:16px;border-top:2px dashed}
.mu i.c{width:8px;height:8px;border-radius:50%}
.mu i.o{width:9px;height:9px;border-radius:50%;border:2px solid}
.mu i.r{width:7px;height:7px;transform:rotate(45deg)}
.mu i.t{font-size:9.5px;font-weight:700;line-height:1}
.ley{display:grid;grid-template-columns:auto 1fr;gap:6px 9px;align-items:center;font-size:12px;line-height:1.3;color:var(--dim);margin:2px 0 4px}
#buscar{width:100%;height:34px;padding:0 10px;margin-bottom:8px;border:1px solid var(--line2);background:rgba(0,0,0,.35);border-radius:2px;font-size:13px}
#buscar::placeholder{color:rgba(239,230,210,.4)}
.lista{list-style:none;margin:0;padding:0}
.lista li button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 6px;border:0;border-bottom:1px solid rgba(239,230,210,.07);background:none;text-align:left;font-size:13px}
.lista li button:hover{background:rgba(239,230,210,.07)}
.lista li button.on{background:rgba(255,162,58,.14);color:var(--sodium)}
.lista li button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista li button em{flex:none;font-style:normal;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.lista li button u{flex:none;text-decoration:none;font-size:10px;font-weight:700;padding:1px 4px;border:1px solid var(--line2);color:var(--dim)}
.ficha{border:1px solid var(--line);background:var(--panel2);padding:10px 11px;margin:0 0 10px;border-radius:2px}
.ficha h4{margin:0 0 7px;font-size:13px;font-weight:700;display:flex;gap:7px;align-items:baseline}
.ficha h4 u{text-decoration:none;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--bile);border:1px solid rgba(166,226,46,.45);padding:1px 5px}
.ficha dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0;font-size:12.5px}
.ficha dt{color:var(--dim)}
.ficha dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.avisos{border:1px solid rgba(255,162,58,.45);background:rgba(255,162,58,.08);padding:9px 11px;margin:0 0 10px;font-size:12.5px;line-height:1.45;border-radius:2px}
.avisos b{color:var(--sodium)}
.avisos ul{margin:5px 0 0;padding-left:17px}

/* ---------- pie ---------- */
#pie{position:fixed;inset:auto 0 0 0;height:var(--pie);display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;z-index:6;white-space:nowrap}
#coords{font-variant-numeric:tabular-nums;font-weight:700;min-width:118px;color:var(--sodium)}
#bajo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
#bajo b{color:var(--bone);font-weight:600}
#escala{display:flex;align-items:center;gap:7px;flex:none;font-variant-numeric:tabular-nums}
#escala i{display:block;height:6px;border:1px solid var(--bone);border-top:0}

/* ---------- avisos flotantes ---------- */
#soltar{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(7,8,13,.82);border:3px dashed var(--sodium);font-size:20px;font-weight:700;letter-spacing:.06em;color:var(--sodium);pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(var(--pie) + 16px);transform:translateX(-50%);z-index:21;max-width:min(560px,92vw);padding:10px 14px;background:rgba(17,19,29,.98);border:1px solid var(--line2);border-left:3px solid var(--bile);font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.55);border-radius:2px}
#toast.mal{border-left-color:#ff4a5e}

/* ---------- pantallas angostas ---------- */
@media (max-width:1240px){#estado span.largo{display:none}.marca span{display:none}}
@media (max-width:1020px){.marca{display:none}#barra{padding-left:10px}}
@media (max-width:860px){
  :root{--ancho:min(330px,88vw)}
  #zona{right:0}
  #panel{box-shadow:-18px 0 40px rgba(0,0,0,.6)}
  body:not(.conpanel) #panel{display:none}
  /* la barra entera se desliza con el dedo; el botón del panel queda primero */
  #barra{overflow-x:auto;scrollbar-width:none}
  #barra::-webkit-scrollbar{display:none}
  #btnPanel{display:block;order:-1}
  #vistas{flex:none;overflow:visible}
  .empuje{display:none}
  #bajo{display:none}
}
@media (max-width:640px){
  #barra{gap:6px;padding:0 8px}
  .bt{padding:0 9px;letter-spacing:.04em;font-size:11.5px}
  #coords{min-width:0}
  #ayuda{font-size:12px}
}
@media print{#barra,#panel,#pie,#zoom,#ayuda,#pin{display:none}#zona{inset:0}}
</style>
</head>
<body>
<header id="barra">
  <div class="marca"><b>Obelisco Mutante</b><span>mapa</span></div>
  <button id="estado" class="bt" type="button" title="De dónde salen los datos"><i></i><span id="estadoTxt">cargando…</span></button>
  <div class="sep"></div>
  <nav id="vistas" class="grupo" aria-label="Ir a una sección"></nav>
  <div class="empuje"></div>

  </div>

  <input id="archivo" type="file" accept=".html,text/html" hidden>
</header>

<main id="zona">
  <canvas id="lienzo" aria-label="Mapa del juego"></canvas>
  <svg id="norte" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 3 L26 27 L17 22 L8 27 Z" fill="#ffa23a" stroke="#07080d" stroke-width="1.5" stroke-linejoin="round"/><text x="17" y="42" text-anchor="middle" font-family="Chakra Petch,system-ui,sans-serif" font-size="12" font-weight="700" fill="#efe6d2" stroke="#07080d" stroke-width="2.5" paint-order="stroke">N</text></svg>

  <div id="zoom"><button class="bt" id="zMas" type="button" aria-label="Acercar">+</button><button class="bt" id="zMenos" type="button" aria-label="Alejar">−</button></div>
  <div id="pin" hidden></div>
</main>

<aside id="panel" aria-label="Panel del mapa">
  <div class="tabs" role="tablist">
    <button type="button" data-tab="capas" class="on">Capas</button>
    <button type="button" data-tab="calles">Calles</button>
    <button type="button" data-tab="lugares">Lugares</button>
    <button type="button" data-tab="datos">Datos</button>
  </div>
  <div class="hoja" id="hoja-capas"></div>
  <div class="hoja" id="hoja-calles" hidden><input id="buscar" type="search" placeholder="Buscar calle…" autocomplete="off"><ul class="lista" id="listaCalles"></ul></div>
  <div class="hoja" id="hoja-lugares" hidden></div>
  <div class="hoja" id="hoja-datos" hidden></div>
</aside>

<footer id="pie">
  <span id="coords">x — · z —</span>
  <span id="bajo">Pasá el mouse por el mapa</span>
  <span id="escala"><i></i><span></span></span>
</footer>
<div id="soltar" hidden>Soltá acá el archivo del juego</div>
